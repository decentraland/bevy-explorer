<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decentraland</title>
    <meta
      name="description"
      content="Explore Decentraland — a social virtual world. Jump in from your browser: events, games, and places built by the community."
    />
    <meta name="theme-color" content="#2c1442" />
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Decentraland Web" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <meta property="og:title" content="Decentraland" />
    <meta property="og:description" content="Explore a social virtual world from your browser." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #54098a;
      }
      iframe {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!-- The shell: the app (HUD + engine, app.html) runs in the iframe below, in its own process.
         app.html is served with Document-Isolation-Policy, which makes it cross-origin isolated on
         its own; this page is deliberately NOT isolated, so the browser keeps the two apart. -->
    <script>
      ;(function () {
        // The service worker's scope is the package DIRECTORY, but the production entry URL has no
        // trailing slash, which puts this page outside it. Canonicalize to the directory form; the
        // one-shot reload below then navigates in scope.
        if (!location.pathname.endsWith('/')) {
          history.replaceState(history.state, '', location.pathname + '/' + location.search + location.hash)
        }

        var frame = null
        function mount() {
          if (frame) return
          frame = document.createElement('iframe')
          frame.src = 'app.html' + location.search + location.hash
          frame.allow = 'fullscreen; microphone; clipboard-read; clipboard-write; autoplay; gamepad'
          frame.addEventListener('load', function () {
            frame.focus()
          })
          document.body.appendChild(frame)
        }

        // Requests from the app for things only the top-level page can do.
        addEventListener('message', function (e) {
          if (!frame || e.source !== frame.contentWindow || e.origin !== location.origin) return
          var m = e.data
          if (!m || typeof m !== 'object') return
          switch (m.type) {
            // the engine's URL sync (engine/boot.js set_url_params), mirrored into the address bar
            case 'bevy-shell:url':
              if (typeof m.search === 'string' && (m.search === '' || m.search[0] === '?')) {
                history.replaceState(null, '', location.pathname + m.search)
              }
              break
            // sign-in: the same-origin auth site, returning here (see src/features/auth/sso.ts)
            case 'bevy-shell:auth-login':
              location.replace('/auth/login?redirectTo=' + encodeURIComponent(location.href))
              break
            // the untrusted-link gate's exit (see src/features/gate/UntrustedLaunchGate.tsx)
            case 'bevy-shell:exit':
              window.close()
              location.replace('https://decentraland.org')
              break
          }
        })

        // The service worker gives app.html its isolation header and strips the host's COOP/COEP
        // from this page (deploy/web/service_worker.js), and the engine's IPFS cache depends on it.
        // A first visit or a hard reload bypasses it, so reload ONCE when it is active; the flag
        // stops a broken worker from reload-looping. Until then the app is not mounted.
        var FLAG = 'coi_sw_reloaded'
        if (!('serviceWorker' in navigator)) return mount()
        if (navigator.serviceWorker.controller) {
          sessionStorage.removeItem(FLAG)
          mount()
        }
        navigator.serviceWorker
          .register('service_worker.js')
          .then(function (reg) {
            if (navigator.serviceWorker.controller) return
            function reloadOnce() {
              if (sessionStorage.getItem(FLAG)) {
                sessionStorage.removeItem(FLAG)
                console.error('[shell] service worker failed to take control after reload')
                mount()
              } else {
                sessionStorage.setItem(FLAG, 'true')
                location.reload()
              }
            }
            if (reg.active) return reloadOnce()
            var pending = reg.installing || reg.waiting
            if (!pending) return mount()
            pending.addEventListener('statechange', function () {
              if (pending.state === 'activated') reloadOnce()
            })
          })
          .catch(function (e) {
            console.log('[shell] service worker registration failed:', e)
            mount()
          })
      })()
    </script>
  </body>
</html>
