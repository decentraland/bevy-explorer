name: Promote headless server to latest

# Promotes an already-published @dcl-regenesislabs/bevy-headless-server snapshot to the
# `latest` dist-tag. Consumers that track `latest` (the SDK preview: js-sdk-toolchain's
# `sdk-commands start`) only move when someone runs this — main pushes keep landing on
# `next` (see publish-headless.yml) and never change what previews run.
#
# The launcher pins the platform packages by exact version, so only its dist-tag affects
# installers; the platform packages are re-tagged too purely so npmjs.com shows a
# coherent `latest` across the family. The launcher is promoted last: if a platform
# re-tag fails midway, the tag that matters has not moved.
#
# Auth: npm OIDC trusted publishing only covers `npm publish`, not `npm dist-tag`, so
# this workflow needs an NPM_TOKEN secret — a granular automation token with read/write
# access to the @dcl-regenesislabs/bevy-headless-server* packages.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to promote (empty = whatever `next` points to)
        type: string
        default: ''

env:
  LAUNCHER: '@dcl-regenesislabs/bevy-headless-server'
  PLATFORMS: 'darwin-arm64 darwin-x64 linux-x64 win32-x64'

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Promote to latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version="$(npm view "$LAUNCHER@next" version)"
          fi
          echo "Current dist-tags:"
          npm view "$LAUNCHER" dist-tags
          # every package must have this version published — a typo or a partial
          # publish fails here before any tag moves
          for platform in $PLATFORMS; do
            npm view "$LAUNCHER-$platform@$version" version >/dev/null
          done
          npm view "$LAUNCHER@$version" version >/dev/null
          for platform in $PLATFORMS; do
            npm dist-tag add "$LAUNCHER-$platform@$version" latest
          done
          npm dist-tag add "$LAUNCHER@$version" latest
          echo "Promoted $LAUNCHER@$version (and platform packages) to latest. Dist-tags now:"
          npm view "$LAUNCHER" dist-tags
