[package]
name = "av"
version = "0.1.0"
edition = "2021"

[lib]

[features]
ffmpeg = []
html = ["media/html", "dep:web-sys"]
livekit = ["comms/livekit"]
av_player_debug = ["bevy/bevy_picking"]

[dependencies]
common = { workspace = true }
dcl = { workspace = true }
dcl_component = { workspace = true }
ipfs = { workspace = true }
scene_runner = { workspace = true }
comms = { workspace = true }
system_bridge = { workspace = true }
media = { workspace = true }

bevy = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
urlencoding = { workspace = true }
bevy_kira_audio = { workspace = true }
kira = { workspace = true }
wgpu = { workspace = true, features = ["webgpu"] }
ethers-core = { workspace = true }

thiserror = { workspace = true }

#[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, optional = true, features = [
  "HtmlMediaElement",
  "HtmlVideoElement",
  "HtmlCollection",
  "AudioContext",
  "AudioBuffer",
  "AudioBufferSourceNode",
  "AudioScheduledSourceNode",
  "GainNode",
  "StereoPannerNode",
  "AudioDestinationNode",
  "AudioParam",
  "VideoFrame",
] }
