[package]
name = "av"
version = "0.1.0"
edition = "2021"

[lib]

[features]
ffmpeg = ["media/ffmpeg"]
html = ["media/html", "dep:web-sys", "dep:wasm-bindgen"]
av_player_debug = ["bevy/bevy_picking"]

[dependencies]
common = { workspace = true }
dcl = { workspace = true }
dcl_component = { workspace = true }
ipfs = { workspace = true }
scene_runner = { workspace = true }
comms = { workspace = true }
system_bridge = { workspace = true }
livestream_manager = { workspace = true }
media = { workspace = true }

bevy = { workspace = true }
disqualified = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
urlencoding = { workspace = true }
bevy_kira_audio = { workspace = true }
kira = { workspace = true }
wgpu = { workspace = true, features = ["webgpu"] }
ethers-core = { workspace = true }
thiserror = { workspace = true }

web-sys = { workspace = true, optional = true, features = [
  "HtmlMediaElement",
  "HtmlVideoElement",
  "HtmlCollection",
  "AudioContext",
  "AudioBuffer",
  "AudioBufferSourceNode",
  "AudioScheduledSourceNode",
  "GainNode",
  "StereoPannerNode",
  "AudioDestinationNode",
  "AudioParam",
  "VideoFrame",
] }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }
js-sys = { workspace = true }

bevy_console = { workspace = true }
